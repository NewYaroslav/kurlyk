name: CI

on:
  push:
    branches: [ main, stable, wip/raw-development ]
  pull_request:
    branches: [ main ]

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        std: [11, 17]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: git submodule update --init --recursive
      - name: Build smoke test
        run: c++ tests/smoke/header_smoke.cpp -Iinclude -std=c++${{ matrix.std }} -o header_smoke
      - name: Run smoke test
        run: ./header_smoke

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        std: [11, 17]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: git submodule update --init --recursive
      - name: Build smoke test
        run: clang++ tests/smoke/header_smoke.cpp -Iinclude -std=c++${{ matrix.std }} -o header_smoke
      - name: Run smoke test
        run: ./header_smoke

  windows:
    name: ${{ matrix.suite }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: mingw-integration
            generator: Ninja
            preload_deps: OFF
            openssl_shared: ON
            curl_shared: ON
          - suite: msvc-integration
            generator: Visual Studio 17 2022
            preload_deps: ON
            openssl_shared: ON
            curl_shared: ON
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: git submodule update --init --recursive

      - name: Set up MSYS2
        if: matrix.suite == 'mingw-integration'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Verify MinGW toolchain
        if: matrix.suite == 'mingw-integration'
        shell: msys2 {0}
        run: |
          gcc --version
          cmake --version
          ninja --version

      - name: Set up MSVC
        if: matrix.generator == 'Visual Studio 17 2022'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure MinGW integration
        if: matrix.suite == 'mingw-integration'
        shell: msys2 {0}
        run: |
          cmake -S tests/integration \
                -B build-${{ matrix.suite }} \
                -G "${{ matrix.generator }}" \
                -DCMAKE_C_COMPILER=gcc \
                -DCMAKE_CXX_COMPILER=g++ \
                -DKURLYK_USE_FALLBACK_OPENSSL=ON \
                -DKURLYK_USE_FALLBACK_CURL=ON \
                -DKURLYK_USE_FALLBACK_ASIO=ON \
                -DKURLYK_USE_FALLBACK_SIMPLE_WS_SERVER=ON \
                -DKURLYK_TEST_PRELOAD_DEPS=${{ matrix.preload_deps }} \
                -DKURLYK_OPENSSL_SHARED=${{ matrix.openssl_shared }} \
                -DKURLYK_CURL_SHARED=${{ matrix.curl_shared }} \
                -DCMAKE_CXX_STANDARD=17 \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                -Wno-dev

      - name: Configure MSVC integration
        if: matrix.suite == 'msvc-integration'
        shell: pwsh
        run: |
          cmake -S tests/integration `
                -B build-${{ matrix.suite }} `
                -G "${{ matrix.generator }}" `
                -DKURLYK_USE_FALLBACK_OPENSSL=ON `
                -DKURLYK_USE_FALLBACK_CURL=ON `
                -DKURLYK_USE_FALLBACK_ASIO=ON `
                -DKURLYK_USE_FALLBACK_SIMPLE_WS_SERVER=ON `
                -DKURLYK_TEST_PRELOAD_DEPS=${{ matrix.preload_deps }} `
                -DKURLYK_OPENSSL_SHARED=${{ matrix.openssl_shared }} `
                -DKURLYK_CURL_SHARED=${{ matrix.curl_shared }} `
                -DCMAKE_CXX_STANDARD=17 `
                -DCMAKE_CXX_STANDARD_REQUIRED=ON `
                -Wno-dev

      - name: Build MinGW integration
        if: matrix.suite == 'mingw-integration'
        shell: msys2 {0}
        run: cmake --build build-${{ matrix.suite }}

      - name: Build MSVC integration
        if: matrix.suite == 'msvc-integration'
        run: cmake --build build-${{ matrix.suite }} --config Release

      - name: Run MinGW integration test
        if: matrix.suite == 'mingw-integration'
        shell: msys2 {0}
        run: ./build-${{ matrix.suite }}/integr_test.exe

      - name: Run MSVC integration test
        if: matrix.suite == 'msvc-integration'
        shell: pwsh
        run: |
          $exe = "build-${{ matrix.suite }}\Release\integr_test.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Executable not found: $exe"
            exit 1
          }
          & $exe

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.suite }}
          path: |
            build-${{ matrix.suite }}/CMakeFiles/CMakeOutput.log
            build-${{ matrix.suite }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  windows-extras:
    name: ${{ matrix.suite }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [odr]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: git submodule update --init --recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Verify MinGW toolchain
        shell: msys2 {0}
        run: |
          gcc --version
          cmake --version
          ninja --version

      - name: Configure ODR checks
        shell: msys2 {0}
        run: |
          cmake -S tests/odr \
                -B build-odr \
                -G Ninja \
                -DCMAKE_C_COMPILER=gcc \
                -DCMAKE_CXX_COMPILER=g++ \
                -Wno-dev

      - name: Build ODR checks
        shell: msys2 {0}
        run: cmake --build build-odr

      - name: Run singleton ODR check
        shell: msys2 {0}
        run: ./build-odr/src_files.exe

      - name: Run auto-init ODR check
        shell: msys2 {0}
        run: ./build-odr/odr_autoinit.exe

      - name: Run synchronous lifecycle check
        shell: msys2 {0}
        run: ./build-odr/lifecycle_sync.exe

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.suite }}
          path: |
            build-odr/CMakeFiles/CMakeOutput.log
            build-odr/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
